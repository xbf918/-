# 宝塔面板 Nginx 反向代理配置
# 量化交易系统 - 站点配置
#
# 使用方法：
# 1. 宝塔面板 → 网站 → 添加站点 → 填入域名/IP → 创建
# 2. 站点设置 → 配置文件 → 替换为以下内容
# 3. 确保前端 dev server (5173)、Node.js (3001)、Python (8001) 已启动

server {
    listen 80;
    server_name _;  # 替换为你的域名或IP

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;

    # 所有请求代理到 Vite dev server (5173)
    # Vite 内部已配置 /api → 3001, /quant → 8001, /ws → 3001 的代理
    # exchangeProxyPlugin 也在 Vite dev server 中运行
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket 代理 (Vite HMR + 交易 WebSocket)
    location /ws {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
